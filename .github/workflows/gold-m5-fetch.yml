name: Gold M5 Fetch (session-reversal research)

# Manual + monthly. Pulls ~12 months of true 5-minute GOLD candles (XAU_USD)
# from OANDA into a SEPARATE gold-m5-ohlc.json (kept out of the 7 MB main
# historical-ohlc.json), then runs the itstomtrades 2nd-hour session-reversal
# research on the real lower timeframe and prints PASS/fail to the job log.
#
# Requires repo secret OANDA_TOKEN (already used by fetch-data.yml). If it's
# unset the fetch step exits loudly — add the secret and re-run.

on:
  workflow_dispatch:
  schedule:
    # Monthly — 1st at 06:41 UTC. M5 gold is research-only; monthly refresh keeps
    # the OOS window growing without spamming the OANDA practice API.
    - cron: '41 6 1 * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch gold M5 (12 months, tick volume)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: python fetch_gold_m5.py --months 12

      - name: Commit gold-m5-ohlc.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-m5-ohlc.json
          git commit -m "data: gold M5 OHLC (session-reversal research) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do
            git push && { echo "pushed"; exit 0; } || { git fetch origin main && git rebase origin/main && sleep 3; }
          done
          echo "::error::push failed after retries"; exit 1

      - name: Session-reversal research on true M5
        run: python session_2h_reversal_research.py

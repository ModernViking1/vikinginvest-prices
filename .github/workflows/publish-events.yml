# .github/workflows/publish-events.yml
#
# Hourly workflow that fetches the Forex Factory economic calendar XML
# and publishes events.json. Used by the dashboard for:
#   - Per-pair event impact dots (red <2h, gold 2-6h, grey 6-24h)
#   - 3/3 alert deferral when high-impact events imminent (<2h)
#   - Events summary widget on the Backtest tab

name: Publish Economic Events

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-events
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and write events.json
        run: |
          python fetch_events.py --output events.json

      - name: Commit and push with race-condition retry
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json
          if git diff --cached --quiet; then
            echo "events.json unchanged — skipping commit"
            exit 0
          fi
          git commit -m "chore: update events.json [skip ci]"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi

            echo "Push rejected — fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — taking our newly fetched events"
              git checkout --theirs events.json 2>/dev/null || true
              git add events.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 3))
          done

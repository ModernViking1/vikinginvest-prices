name: cam_rev LIMIT-execution Backtest (3yr)

# On-demand: fetch deep m15 and backtest cam_rev under the NEW limit-order execution — a resting
# limit at ref_entry that only fills if price returns to the level — vs the existing immediate-fill
# model, over the full 3-year history with placement-lag sensitivity and OOS halves. Prints the
# comparison to the job log (read it there) and commits NOTHING. Heavy fetch → manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Daily/H1 context window in days'
        default: '1095'
      m15_days:
        description: 'm15 depth in days (the 3-year test surface)'
        default: '1095'

concurrency:
  group: cam-limit-backtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in cam_limit_backtest.py unified_shadow_harness.py detect_triggers.py \
                   fetch_historical_ohlc.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Restore deep m15 from cache release (else fetch fresh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          CACHE_TAG: deep-ohlc-cache
        run: |
          if gh release download "$CACHE_TAG" --repo "$GITHUB_REPOSITORY" -p deep-ohlc.json.gz --clobber 2>/dev/null; then
            gunzip -c deep-ohlc.json.gz > deep-ohlc.json
            echo "✅ restored deep-ohlc.json from '$CACHE_TAG' cache ($(ls -lh deep-ohlc.json | awk '{print $5}'))"
          else
            echo "cache miss — fetching fresh deep m15 (slow; ~45-90 min)"
            DAYS="${{ github.event.inputs.days || '1095' }}"
            M15="${{ github.event.inputs.m15_days || '1095' }}"
            python fetch_historical_ohlc.py --days "$DAYS" --m15-days "$M15" --output deep-ohlc.json
          fi
          ls -lh deep-ohlc.json

      - name: Run cam_rev limit-execution backtest (result in this log)
        run: |
          echo "================ RESULT ================"
          python cam_limit_backtest.py --hist deep-ohlc.json
          echo "========================================"
          rm -f deep-ohlc.json

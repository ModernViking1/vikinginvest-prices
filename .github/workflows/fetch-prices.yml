name: Fetch prices

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify fetch-prices.js exists
        run: |
          if [ ! -f fetch-prices.js ]; then
            echo "::error::fetch-prices.js missing from repo root"
            ls -la
            exit 1
          fi

      - name: Fetch prices
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: node fetch-prices.js

      - name: Commit and push with race-condition retry
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json
          if [ -f history.json ]; then
            git add history.json
            echo "Including history.json"
          fi
          # NOTE: intraday.json no longer written by default (see fetch-prices.js).
          # Stage if present, for FORCE_LEGACY_INTRADAY=true cases.
          if [ -f intraday.json ]; then
            git add intraday.json
            echo "Including intraday.json (legacy/forced)"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit — exiting"
            exit 0
          fi

          git commit -m "chore: update prices"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts — giving up"
              exit 1
            fi

            echo "Push rejected — fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — taking our newly fetched data"
              for f in prices.json history.json intraday.json; do
                if [ -f "$f" ]; then
                  git checkout --theirs "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                fi
              done
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 3))
          done

      - name: Build package.json for npm
        run: |
          VERSION="1.0.$(date +%s)"
          cat > package.json <<PKG
          {
            "name": "vikinginvest-prices",
            "version": "$VERSION",
            "description": "Live FX prices for Viking Invest dashboard",
            "main": "prices.json",
            "jsdelivr": "prices.json",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ModernViking1/vikinginvest-prices.git"
            }
          }
          PKG

      - name: Publish to npm (non-fatal)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm publish failures must not fail this workflow — the canonical
          # data is already in the GitHub repo. statically.io and jsDelivr's
          # gh endpoint serve it without depending on npm.
          if npm publish --access=public 2>&1; then
            echo "✅ npm publish succeeded"
          else
            echo "::warning::npm publish failed (non-fatal). Data still served via statically.io and jsDelivr gh."
          fi

      - name: Purge jsDelivr cache (non-fatal)
        run: |
          # /npm/ cache: invalidate every data file the npm publish above
          # just bundled, so the dashboard's npm fallback paths return the
          # snapshot we just published rather than the previous version.
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/prices.json" || echo "purge npm prices failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/history.json" || echo "purge npm history failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/intraday-ohlc.json" || echo "purge npm intraday-ohlc failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/events.json" || echo "purge npm events failed"
          # /gh/@main cache: prices.json updates here too (history.json is
          # large enough that gh@main is rarely fetched).
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/prices.json" || echo "purge gh prices failed"

name: Fetch prices

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify fetch-prices.js exists
        run: |
          if [ ! -f fetch-prices.js ]; then
            echo "::error::fetch-prices.js missing from repo root"
            ls -la
            exit 1
          fi

      - name: Fetch prices
        env:
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: node fetch-prices.js

      - name: Commit and push with race-condition retry
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all data files first (don't commit yet — we need to
          # check if they actually changed after a potential rebase).
          git add prices.json
          if [ -f history.json ]; then
            git add history.json
            echo "Including history.json"
          fi
          if [ -f intraday.json ]; then
            git add intraday.json
            echo "Including intraday.json"
          fi

          # If nothing staged, exit cleanly.
          if git diff --cached --quiet; then
            echo "No changes to commit — exiting"
            exit 0
          fi

          # Commit locally first. We'll resolve any race against remote
          # via rebase-on-push retry below.
          git commit -m "chore: update prices"

          # Retry-push loop. Handles the race when other workflows
          # (publish-intraday-ohlc, deploy-dashboard, pages-build-deployment)
          # commit to main between our last pull and our push.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts — giving up"
              exit 1
            fi

            # Push failed (likely race). Rebase our commit onto the new
            # remote main and retry. If rebase fails due to conflicts in
            # JSON files (which can happen if both workflows updated the
            # same fields), we strategy-choose: prefer OUR data (newer
            # fetched prices) over the remote's stale snapshot.
            echo "Push rejected — fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — taking our newly fetched data"
              # During rebase, "--theirs" refers to the commit being replayed
              # on top (our newly fetched data), while "--ours" refers to the
              # current HEAD which is origin/main. We want OUR new data, so:
              for f in prices.json history.json intraday.json; do
                if [ -f "$f" ]; then
                  git checkout --theirs "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                fi
              done
              git rebase --continue || git rebase --abort
            fi
            # Small backoff so concurrent workflows have a chance to finish
            sleep $((attempt * 3))
          done

      - name: Build package.json for npm
        run: |
          VERSION="1.0.$(date +%s)"
          cat > package.json <<PKG
          {
            "name": "vikinginvest-prices",
            "version": "$VERSION",
            "description": "Live FX prices for Viking Invest dashboard",
            "main": "prices.json",
            "jsdelivr": "prices.json",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ModernViking1/vikinginvest-prices.git"
            }
          }
          PKG

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/prices.json" || true
          curl -s "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/history.json" || true
          curl -s "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/intraday.json" || true

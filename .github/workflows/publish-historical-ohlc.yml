name: Historical OHLC Backfill

# Manual trigger only — this is a one-shot bulk fetch (~3-5 minutes runtime).
# Subsequent runs replace the historical-ohlc.json published to npm/jsDelivr.
#
# To run:
#   1. Go to Actions tab in the repo
#   2. Select "Historical OHLC Backfill" workflow
#   3. Click "Run workflow" → choose branch (main) → Run workflow
#   4. Wait ~3-5 minutes for completion
#   5. Verify the new historical-ohlc.json was committed and published

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'History window in days for daily + 1H (default 365). m15 layer is always capped to 30 days — needed to keep the JSON file under GitHub''s 100 MB push limit. Crypto deep-fetch uses the same cap.'
        required: false
        default: '365'
      pairs:
        description: 'Optional subset (comma-separated, e.g. "jp225,fra40,esp35"). Subset runs auto-merge with the existing file so other pairs are preserved. Leave blank for a full rebuild of every pair.'
        required: false
        default: ''
      publish_only:
        description: 'Skip the OANDA re-fetch — just npm-publish + purge the historical-ohlc.json already on main. Use "true" to push the existing file to the CDN fast (~1 min) without a full backfill.'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # safety upper bound; typical run ~5 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run historical OHLC backfill
        if: ${{ inputs.publish_only != 'true' }}
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          # Auto-enable --merge when a pair subset is supplied. Without
          # this, a subset run writes ONLY the listed pairs to
          # historical-ohlc.json and silently drops everyone else —
          # turning a "just refresh these 3 indices" run into a
          # full-file wipe of the other 46 pairs. With --merge, pairs
          # not in the subset are copied from the existing file
          # (fetch_historical_ohlc.py line 357). Leaving the pairs
          # field blank still does a full rebuild as before.
          PAIRS_ARG=""
          MERGE_ARG=""
          if [ -n "${{ inputs.pairs }}" ]; then
            PAIRS_ARG="--pairs ${{ inputs.pairs }}"
            MERGE_ARG="--merge"
            echo "Subset run: $PAIRS_ARG (merging with existing file)"
          else
            echo "Full rebuild: refetching every pair in PAIRS dict"
          fi
          python fetch_historical_ohlc.py \
            --days ${{ inputs.days }} \
            --m15-days 30 \
            --output historical-ohlc.json \
            $PAIRS_ARG $MERGE_ARG
          ls -lh historical-ohlc.json

      - name: Verify output sanity
        if: ${{ inputs.publish_only != 'true' }}
        run: |
          python -c "
          import json, sys
          with open('historical-ohlc.json') as f:
              d = json.load(f)
          pairs = d.get('pairs', {})
          if not pairs:
              print('ERROR: no pairs in output')
              sys.exit(1)
          total = 0
          missing = []
          for k, v in pairs.items():
              n_m15 = len(v.get('m15', []))
              n_h1 = len(v.get('h1', []))
              n_d = len(v.get('daily', []))
              total += n_m15 + n_h1 + n_d
              if n_m15 < 1000 or n_h1 < 100 or n_d < 30:
                  missing.append(f'{k} (m15={n_m15}, h1={n_h1}, d={n_d})')
          print(f'Total bars: {total:,} across {len(pairs)} pairs')
          if missing:
              print('WARN: pairs with thin data:', ', '.join(missing))
          import os
          print(f'File size: {os.path.getsize(\"historical-ohlc.json\")/(1024*1024):.2f} MB')
          "

      - name: Commit historical-ohlc.json with race-condition retry
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bump version in package.json so jsDelivr picks up the new file
          if [ -f package.json ]; then
            python -c "
          import json
          with open('package.json') as f:
              p = json.load(f)
          v = p.get('version', '0.0.0')
          parts = v.split('.')
          parts[-1] = str(int(parts[-1]) + 1)
          p['version'] = '.'.join(parts)
          with open('package.json', 'w') as f:
              json.dump(p, f, indent=2)
          print('Bumped version to', p['version'])
          "
            git add package.json
          fi
          git add historical-ohlc.json
          if git diff --staged --quiet; then
            echo "No changes to commit (historical-ohlc.json identical)"
            exit 0
          fi
          git commit -m "Historical OHLC backfill — ${{ inputs.days }}d"

          # Race-retry pattern matching the other data workflows
          # (fetch-data.yml, alert-on-trigger.yml, publish-events.yml).
          # The 5-10 min backfill window almost guarantees a concurrent
          # fetch-data commit lands first; without retry the whole run is
          # wasted and the new history file is dropped on the floor.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Push rejected — fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — taking our newly backfilled history"
              for f in historical-ohlc.json package.json; do
                if [ -f "$f" ]; then
                  git checkout --theirs "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                fi
              done
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 3))
          done

      - name: Publish to npm + purge jsDelivr cache
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The dashboard's DEEP_HIST loads historical-ohlc.json from the
          # CDN. The repo is PRIVATE, so jsDelivr /gh/, statically.io and
          # raw.githubusercontent can't read it — the only working public
          # path is the npm package via jsDelivr /npm/@latest.
          #
          # fetch-data.yml's npm publish bundles whatever's in the repo,
          # but it does NOT purge historical-ohlc.json from the jsDelivr
          # npm cache — so after a backfill the dashboard kept loading the
          # stale pre-backfill file (symptom: new pairs stuck on neutral
          # EW/TL because their daily/h1 history never reached the
          # browser). Publish + purge here so the fresh file is live
          # immediately after the backfill, without waiting for — or
          # depending on — a fetch-data cycle.
          if npm publish --access=public 2>&1; then
            echo "✅ npm publish succeeded"
          else
            echo "::warning::npm publish failed (non-fatal) — historical-ohlc.json will still reach npm via the next fetch-data run"
          fi
          # Purge the jsDelivr npm cache so the dashboard picks up the
          # fresh file on the next load instead of the stale cached copy.
          curl -s -m 20 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/historical-ohlc.json" || echo "purge historical-ohlc.json failed (non-fatal)"
          echo "Purge requested for historical-ohlc.json"

name: Equity Market Expansion Backtest (.EQ across US/DE/UK/FR)

# Do the .EQ edges hold beyond the 5 US pilot names? Fetches h1+m15 for US top-10 + DE/UK/FR
# large-caps and replays the causal .EQ detectors, net of costs, per market x strategy. Read-only —
# prints to the log, commits nothing. International data depends on the TwelveData plan (free is
# US-only), so coverage is reported and any unavailable market shows as 'no data'.

on:
  workflow_dispatch:
    inputs:
      intervals: { description: 'timeframes to fetch', default: 'h1,m15' }

concurrency: { group: equity-expansion-backtest, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip requests
      - name: Guard files present
        run: for f in equity_market_expansion_backtest.py fetch_equity_ohlc.py unified_shadow_harness.py backtest_rsi_per_class.py; do [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }; done
      - name: Run expansion backtest (result in log)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TD_API_KEY }}
        run: python equity_market_expansion_backtest.py --intervals "${{ github.event.inputs.intervals || 'h1,m15' }}"

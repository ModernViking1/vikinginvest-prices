name: Swing Shadow Forward-Test

# Runs the unified swing shadow harness (H&S+macro / S5-engulf / S5-rsi) against
# the latest published historical-ohlc.json, detects new signals, scores logged
# ones, and commits swing-shadow-log.json. This is EVIDENCE-GATHERING ONLY: the
# log is inert research data that nothing on the platform (cBot, dashboard,
# signals.json) reads. No trading, no live orders, no platform impact.
#
# Daily cadence (06:17 UTC, offset to dodge the scheduler herd). Forward signals
# accrue slowly as new bars publish, so daily is ample.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: swing-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Guard — required files present
        run: |
          for f in unified_shadow_harness.py historical-ohlc.json \
                   detect_triggers.py backtest_rsi_per_class.py \
                   hs_swing_research.py five_strategies_research.py; do
            if [ ! -f "$f" ]; then echo "::error::$f missing from repo root"; exit 1; fi
          done

      - name: Run unified shadow harness
        run: python unified_shadow_harness.py

      - name: Commit + push swing-shadow-log.json (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- swing-shadow-log.json; then
            echo "no change to swing-shadow-log.json"; exit 0
          fi
          git add swing-shadow-log.json
          git commit -m "chore: update swing shadow forward-test log [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin main 2>&1; then echo "pushed"; exit 0; fi
            echo "push race, rebasing (attempt $i)"; git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((2 ** i))
          done
          echo "::error::failed to push swing-shadow-log.json after retries"; exit 1

name: Deep Backtest (3-year track record)

# Server-side deep backtest (dashboard "option 1"). Fetches THREE YEARS of OHLC into the
# runner, replays the full shadow-harness scoring over it, and publishes only a small
# backtest-summary.json (per-strategy expectancy / WR / OOS halves / drawdown + a sampled
# book equity curve, gated by the live trend-quality filter). The 2-year raw OHLC is NEVER
# committed — it's fetched to a throwaway file, backtested, and discarded — so the dashboard
# gets a 2-year track record without loading 2 years of bars (and without touching the
# ~50 MB / 100 MB-limited 12-month historical-ohlc.json the interactive backtest uses).
#
# Heavy job (fetch ~2yr all pairs + score dozens of strategies) so it runs weekly, not on
# every push. Needs the OANDA_TOKEN secret (same one publish-historical-ohlc.yml uses).

on:
  schedule:
    - cron: '23 5 * * 1'      # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'History window in days'
        default: '1095'
      m15_days:
        description: 'm15 depth in days (kept small; h1 carries the swing backtest)'
        default: '120'

concurrency:
  group: deep-backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in backtest_history.py backtest_intraday.py unified_shadow_harness.py trend_regime.py \
                   backtest_rsi_per_class.py fetch_historical_ohlc.py detect_triggers.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Fetch 3-year OHLC (throwaway — not committed)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          DAYS="${{ github.event.inputs.days || '1095' }}"
          M15="${{ github.event.inputs.m15_days || '365' }}"
          echo "Fetching ${DAYS}d (m15 ${M15}d) to deep-ohlc.json ..."
          python fetch_historical_ohlc.py --days "$DAYS" --m15-days "$M15" --output deep-ohlc.json
          ls -lh deep-ohlc.json

      - name: Run deep backtest (swing + intraday) -> backtest-summary.json
        run: |
          # Swing / harness engine (h1, ~3yr) — the bulk of the book.
          python backtest_history.py --hist deep-ohlc.json --out backtest-summary.json
          # Intraday engine (m15) — the 4/4 'structural' path (macdp is crypto/conf-4/Faytterro-
          # gated to ~0 live, macd_divergence retired), replayed with the faithful live gates.
          python backtest_intraday.py --hist deep-ohlc.json --out intraday-summary.json --no-anchor
          rm -f deep-ohlc.json         # discard the deep OHLC (never committed)
          # Merge only genuinely-live, well-sampled intraday strategies (n>=40, both OOS halves +).
          python - <<'PY'
          import json
          s=json.load(open('backtest-summary.json')); it=json.load(open('intraday-summary.json'))
          si={k:v for k,v in it.get('strategies_intraday',{}).items()
              if v['n']>=40 and v['oos_1st']>0 and v['oos_2nd']>0}
          s['strategies_intraday']=si
          s['book_intraday']=it.get('book_intraday',{})
          s['equity_curve_intraday']=it.get('equity_curve_intraday',[])
          s['intraday_window_days']=it.get('window_days',0)
          json.dump(s,open('backtest-summary.json','w'),separators=(',',':'))
          print('merged intraday strategies:', list(si.keys()), '| m15 window ~', s['intraday_window_days'],'d')
          PY
          rm -f intraday-summary.json
          echo "summary size:"; ls -lh backtest-summary.json

      - name: Commit + push backtest-summary.json (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- backtest-summary.json; then
            echo "no change to backtest-summary.json"; exit 0
          fi
          git add backtest-summary.json
          git commit -m "chore: update 2-year backtest summary [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin main 2>&1; then echo pushed; exit 0; fi
            echo "push race, rebasing ($i)"; git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((2 ** i))
          done
          echo "::error::failed to push backtest-summary.json after retries"; exit 1

      - name: Purge CDN
        run: |
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/backtest-summary.json" || echo "purge failed"

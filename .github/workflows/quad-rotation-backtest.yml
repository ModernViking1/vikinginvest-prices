name: HPS Quad-Rotation Backtest (3yr)

# On-demand: fetch deep m15 and backtest the HPS 'Quad Divergence' super-signal across all asset
# classes on the lower timeframe (m15) and h1, with first-target vs trend-aware exits and OOS halves.
# Prints to the job log (read it there). Heavy fetch → manual dispatch only. Commits nothing.

on:
  workflow_dispatch:
    inputs:
      tf:
        description: 'Timeframe to test (m15 / h1)'
        default: 'm15'
      days:
        description: 'Daily/H1 context window in days'
        default: '1095'
      m15_days:
        description: 'm15 depth in days'
        default: '1095'

concurrency:
  group: quad-rotation-backtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in quad_rotation_research.py unified_shadow_harness.py detect_triggers.py \
                   fetch_historical_ohlc.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Fetch deep-m15 OHLC (throwaway — not committed)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          DAYS="${{ github.event.inputs.days || '1095' }}"
          M15="${{ github.event.inputs.m15_days || '1095' }}"
          python fetch_historical_ohlc.py --days "$DAYS" --m15-days "$M15" --output deep-ohlc.json
          ls -lh deep-ohlc.json

      - name: Run quad-rotation backtest (result in this log)
        run: |
          TF="${{ github.event.inputs.tf || 'm15' }}"
          echo "================ RESULT (${TF}) ================"
          python quad_rotation_research.py --hist deep-ohlc.json --tf "$TF"
          echo "================ RESULT (h1) ================"
          python quad_rotation_research.py --hist deep-ohlc.json --tf h1
          echo "========================================"
          rm -f deep-ohlc.json

name: Alert on Trigger

# Runs every 10 minutes (and also right after each Fetch Data run).
# Detects pairs that just transitioned to 3/3 confluence alignment, and
# 15m 1:1-RR setups that just triggered, and sends a Telegram message
# for each. State persisted in alerts-state.json so we don't re-alert
# while a pair stays aligned / on an already-alerted setup.
#
# Requires repo secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
# Without them the script runs but skips the actual send (useful for
# baselining state without spam).
#
# First run after this workflow lands: no alerts will fire — the script
# treats the missing alerts-state.json as a baseline-establishment run.
# Subsequent runs detect transitions from that baseline.

on:
  # Primary trigger: a fixed schedule, independent of Fetch Data. The
  # detector only reads already-committed data files, so it does not
  # need Fetch Data to have *just* completed. Chaining solely off
  # workflow_run was fragile — any Fetch Data run that concluded
  # 'failure' silently skipped the alert job (see the detect job's `if`),
  # which is why automatic alerts never fired.
  schedule:
    # Every 5 minutes — halves trigger-alert latency vs the old 10-min
    # cadence. With trigger alerts being the only auto-fired path now
    # (alignment alerts are catch-up-only), low latency matters more.
    - cron: '*/5 * * * *'
  # Low-latency path: also fire immediately after Fetch Data succeeds.
  workflow_run:
    workflows: ["Fetch Data (prices + intraday OHLC)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      send_all_aligned:
        description: 'One-shot: also send Telegram messages for every currently-aligned pair, ignoring stored state. Useful for verifying the pipeline end-to-end after first setup. Set "true" to enable.'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: alert-on-trigger
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Run on schedule / manual dispatch unconditionally. For the
    # workflow_run path only, skip if the upstream Fetch Data run failed
    # — alerting on stale data is misleading, and the next scheduled run
    # picks it up anyway once data recovers.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull the freshly committed data files from the same SHA that
          # the fetch-data run produced. Without ref, workflow_run gives
          # us the SHA at workflow-trigger time (older).
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify detector script exists
        run: |
          if [ ! -f detect_triggers.py ]; then
            echo "::error::detect_triggers.py missing from repo root"
            exit 1
          fi

      - name: Detect new triggers and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_ALL_ALIGNED: ${{ github.event.inputs.send_all_aligned || 'false' }}
        run: python detect_triggers.py

      - name: Commit updated state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts-state.json directions.json
          if git diff --staged --quiet; then
            echo "alerts-state.json + directions.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update alerts state + directions [skip ci]"

          # Race-retry: on push rejection, rebuild our commit on top of
          # the latest main. reset --mixed moves HEAD + index only,
          # leaving our freshly-written files in the working tree; we
          # then re-stage and recommit. Conflict-free — no rebase, no
          # `git rebase --continue` editor prompt to hang headless CI.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            git fetch origin main
            git reset --mixed origin/main
            git add alerts-state.json directions.json
            if git diff --cached --quiet; then
              echo "No changes vs latest main — nothing to push"
              exit 0
            fi
            git commit -m "chore: update alerts state + directions [skip ci]"
            sleep $((attempt * 3))
          done

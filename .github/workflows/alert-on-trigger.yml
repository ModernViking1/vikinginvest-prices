name: Alert on Trigger

# Runs after every successful Fetch Data workflow. Detects pairs that
# just transitioned to 3/3 confluence alignment and sends a Telegram
# message for each new alignment. State persisted in alerts-state.json
# so we don't re-alert while a pair stays aligned.
#
# Requires repo secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
# Without them the script runs but skips the actual send (useful for
# baselining state without spam).
#
# First run after this workflow lands: no alerts will fire — the script
# treats the missing alerts-state.json as a baseline-establishment run.
# Subsequent runs detect transitions from that baseline.

on:
  workflow_run:
    workflows: ["Fetch Data (prices + intraday OHLC)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      send_all_aligned:
        description: 'One-shot: also send Telegram messages for every currently-aligned pair, ignoring stored state. Useful for verifying the pipeline end-to-end after first setup. Set "true" to enable.'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: alert-on-trigger
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Skip if the upstream fetch-data run itself failed — alerting on
    # stale data is misleading.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull the freshly committed data files from the same SHA that
          # the fetch-data run produced. Without ref, workflow_run gives
          # us the SHA at workflow-trigger time (older).
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify detector script exists
        run: |
          if [ ! -f detect_triggers.py ]; then
            echo "::error::detect_triggers.py missing from repo root"
            exit 1
          fi

      - name: Detect new triggers and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_ALL_ALIGNED: ${{ github.event.inputs.send_all_aligned || 'false' }}
        run: python detect_triggers.py

      - name: Commit updated state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts-state.json
          if git diff --staged --quiet; then
            echo "alerts-state.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update alerts state [skip ci]"

          # Standard race-retry pattern matching the other workflows.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs alerts-state.json 2>/dev/null || true
              git add alerts-state.json 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 3))
          done

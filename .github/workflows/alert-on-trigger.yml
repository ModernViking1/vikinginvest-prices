name: Alert on Trigger (manual / catch-up)

# RETIRED AS THE LIVE PATH (2026-06-02).
# detect_triggers.py now runs inline at the end of fetch-data.yml
# (commit 0abe1d58 → 82c27c76), so live Telegram alerts inherit
# fetch-data's reliable every-5-min cadence via repository_dispatch.
#
# This workflow is kept for two reasons:
#   1. Manual catch-up runs — set send_all_aligned=true to fire a
#      Telegram for every currently-aligned pair (ignoring stored
#      state). Useful after a long outage or for verifying the
#      pipeline end-to-end.
#   2. Belt-and-braces fallback if the inline path in fetch-data.yml
#      ever breaks — a single weekly scheduled run will still flag
#      any in-progress trigger that the live path missed.
#
# Requires repo secrets:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

on:
  # Weekly fallback only. The 5-min cron used to live here but
  # GitHub Actions was throttling it to every 3-4h anyway, and the
  # workflow_run chain off Fetch Data wasn't firing reliably either.
  # The live path is now inlined in fetch-data.yml; this schedule
  # only fires once a week as a sanity check.
  schedule:
    - cron: '7 12 * * 1'  # every Monday at 12:07 UTC
  workflow_dispatch:
    inputs:
      send_all_aligned:
        description: 'One-shot: also send Telegram messages for every currently-aligned pair, ignoring stored state. Useful for verifying the pipeline end-to-end after first setup. Set "true" to enable.'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: alert-on-trigger
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # Run on schedule / manual dispatch unconditionally. For the
    # workflow_run path only, skip if the upstream Fetch Data run failed
    # — alerting on stale data is misleading, and the next scheduled run
    # picks it up anyway once data recovers.
    # workflow_run trigger removed 2026-06-02; only schedule + manual now.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull the freshly committed data files from the same SHA that
          # the fetch-data run produced. Without ref, workflow_run gives
          # us the SHA at workflow-trigger time (older).
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify detector script exists
        run: |
          if [ ! -f detect_triggers.py ]; then
            echo "::error::detect_triggers.py missing from repo root"
            exit 1
          fi

      - name: Detect new triggers and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_ALL_ALIGNED: ${{ github.event.inputs.send_all_aligned || 'false' }}
        run: python detect_triggers.py

      - name: Commit updated state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts-state.json directions.json
          if git diff --staged --quiet; then
            echo "alerts-state.json + directions.json unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update alerts state + directions [skip ci]"

          # Race-retry: on push rejection, rebuild our commit on top of
          # the latest main. reset --mixed moves HEAD + index only,
          # leaving our freshly-written files in the working tree; we
          # then re-stage and recommit. Conflict-free — no rebase, no
          # `git rebase --continue` editor prompt to hang headless CI.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            git fetch origin main
            git reset --mixed origin/main
            git add alerts-state.json directions.json
            if git diff --cached --quiet; then
              echo "No changes vs latest main — nothing to push"
              exit 0
            fi
            git commit -m "chore: update alerts state + directions [skip ci]"
            sleep $((attempt * 3))
          done

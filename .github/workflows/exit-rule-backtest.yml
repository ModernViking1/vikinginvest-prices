name: Exit-Rule Backtest (3yr deep cache, read-only)

# Runs exit_rule_backtest.py over the 3-year deep cache (FX / commodity / index / crypto) to confirm
# whether the tighter 0.75R trail that beat baseline on the US equities also holds across the whole
# trailing-runner portfolio and both OOS halves — before we change the live exit. Commits nothing.

on:
  workflow_dispatch:

concurrency: { group: exit-rule-backtest, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip requests
      - name: Guard files present
        run: for f in exit_rule_backtest.py unified_shadow_harness.py backtest_rsi_per_class.py market_wizards_research.py fetch_historical_ohlc.py; do [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }; done
      - name: Restore deep m15 cache (else fetch 3yr)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', OANDA_TOKEN: '${{ secrets.OANDA_TOKEN }}', CACHE_TAG: deep-ohlc-cache }
        run: |
          if gh release download "$CACHE_TAG" --repo "$GITHUB_REPOSITORY" -p deep-ohlc.json.gz --clobber 2>/dev/null; then
            gunzip -c deep-ohlc.json.gz > deep-ohlc.json; echo "restored $(ls -lh deep-ohlc.json|awk '{print $5}')"
          else
            python fetch_historical_ohlc.py --days 1095 --m15-days 1095 --output deep-ohlc.json
          fi
      - name: Exit-rule variants over 3yr (whole trailing-runner portfolio)
        run: |
          echo "================ RESULT ================"
          python exit_rule_backtest.py --hist deep-ohlc.json
          echo "========================================"
          rm -f deep-ohlc.json deep-ohlc.json.gz

name: Deep m15 Backtest (seasonality)

# Sibling to deep-backtest.yml, but fetches a DEEP m15 window so the m15 strategies
# (cam_rev, mmove_m15, holygrail_cm_m15, fma_sweep_cm, absorb_btc, fma_gold) get a full
# multi-year monthly/seasonality record instead of the ~4 recent months the weekly run's
# shallow m15 depth allows. Heavy (3yr of m15 across all pairs), so it runs MONTHLY, not
# weekly, with a long timeout. Publishes a SEPARATE m15-backtest-summary.json; the dashboard
# overlays that file's monthly series for the m15 strategies onto the main summary. The raw
# OHLC is fetched to a throwaway file and never committed.

on:
  schedule:
    - cron: '17 6 3 * *'      # 3rd of each month, 06:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Daily/H1 window in days (context for the m15 detectors)'
        default: '1095'
      m15_days:
        description: 'm15 depth in days (the whole point — go deep here)'
        default: '1095'

concurrency:
  group: m15-deep-backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in backtest_history.py unified_shadow_harness.py trend_regime.py \
                   fetch_historical_ohlc.py detect_triggers.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Fetch deep-m15 OHLC (throwaway — not committed)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          DAYS="${{ github.event.inputs.days || '1095' }}"
          M15="${{ github.event.inputs.m15_days || '1095' }}"
          echo "Fetching ${DAYS}d (DEEP m15 ${M15}d) to deep-m15-ohlc.json ..."
          python fetch_historical_ohlc.py --days "$DAYS" --m15-days "$M15" --output deep-m15-ohlc.json
          ls -lh deep-m15-ohlc.json

      - name: Run backtest -> m15-backtest-summary.json
        run: |
          # Full harness scoring over the deep-m15 fetch. The dashboard only reads the m15
          # strategies' monthly_gated / strategies_gated from this file; the H1/daily strategies
          # here run on the same (deep) window but the main backtest-summary.json remains their
          # authority. Compact output; raw OHLC discarded.
          python backtest_history.py --hist deep-m15-ohlc.json --out m15-backtest-summary.json
          rm -f deep-m15-ohlc.json
          echo "summary size:"; ls -lh m15-backtest-summary.json

      - name: Commit + push m15-backtest-summary.json (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- m15-backtest-summary.json; then
            echo "no change to m15-backtest-summary.json"; exit 0
          fi
          git add m15-backtest-summary.json
          git commit -m "chore: update deep-m15 seasonality summary [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin main 2>&1; then echo pushed; exit 0; fi
            echo "push race, rebasing ($i)"; git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((2 ** i))
          done
          echo "::error::failed to push m15-backtest-summary.json after retries"; exit 1

      - name: Purge CDN
        run: |
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/m15-backtest-summary.json" || echo "purge failed"

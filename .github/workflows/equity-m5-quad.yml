name: Equity 5-min Quad-Rotation Test

# On-demand: pull 5-min OHLC for the 5 US mega-caps (AAPL/NVDA/TSLA/MSFT/AMZN) to a THROWAWAY file
# and backtest both HPS setups (Quad Divergence + 20/20 Bull Flag) on 5-min — the closest available
# timeframe to the strategy's native 1-min. Prints to the job log; commits nothing (the throwaway
# equity-m5.json is discarded, so the committed equity-ohlc.json is untouched).

on:
  workflow_dispatch:

concurrency:
  group: equity-m5-quad
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in fetch_equity_ohlc.py quad_rotation_research.py unified_shadow_harness.py \
                   detect_triggers.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Fetch 5-min equity OHLC (throwaway — not committed)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TD_API_KEY }}
        run: |
          python fetch_equity_ohlc.py --output equity-m5.json --intervals m5 --no-earnings
          python - <<'PY'
          import json
          d=json.load(open('equity-m5.json'))['pairs']
          for pk,ly in d.items():
              m5=ly.get('m5') or []
              print(f"  {pk}: {len(m5)} m5 bars" + (f" ({m5[0]['t']} .. {m5[-1]['t']})" if m5 else " (EMPTY)"))
          PY

      - name: Backtest both HPS setups on 5-min equities (result in this log)
        run: |
          echo "================ QUAD DIVERGENCE (equity m5) ================"
          python quad_rotation_research.py --hist equity-m5.json --tf m5 --setup quaddiv
          echo "================ 20/20 BULL FLAG (equity m5) ================"
          python quad_rotation_research.py --hist equity-m5.json --tf m5 --setup bullflag
          echo "========================================"
          rm -f equity-m5.json

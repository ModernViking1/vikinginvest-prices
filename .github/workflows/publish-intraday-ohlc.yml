# .github/workflows/publish-intraday-ohlc.yml
#
# OHLC publisher v3 — OANDA-only, with race-condition-resistant push.
#
# DESIGN:
#   - Cron triggers every 5 minutes
#   - Each workflow run does 2 polls 60 seconds apart (--loop 2)
#   - Net effect: ~5 ticks per 15-minute window per pair
#   - All FX/commodity/index pairs use OANDA (one batched API call per poll)
#
# WHY v3: previous version's git rebase recovery wasn't handling all race
# conditions (e.g. when both fetch-prices and intraday workflows committed
# simultaneously). v3 uses the same retry-with-rebase pattern that works
# for fetch-prices.yml.

name: Publish Intraday OHLC

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-intraday-ohlc
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run publisher (2 polls × 60s)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          python publish_intraday_ohlc.py \
            --state intraday-state.json \
            --output intraday-ohlc.json \
            --loop 2 \
            --interval 60

      - name: Commit and push with race-condition retry
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage data files
          git add intraday-ohlc.json intraday-state.json

          # If nothing changed, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit locally first
          git commit -m "chore: update intraday OHLC [skip ci]"

          # Retry push loop — handle race conditions with other workflows
          # (fetch-prices, deploy-dashboard, publish-economic-events) that
          # all write to main concurrently.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi

            echo "Push rejected — fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — taking our newly published intraday data"
              # During rebase, --theirs refers to the commit being replayed
              # (our new intraday data). --ours is origin/main. We want OUR data.
              for f in intraday-ohlc.json intraday-state.json; do
                if [ -f "$f" ]; then
                  git checkout --theirs "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                fi
              done
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 3))
          done

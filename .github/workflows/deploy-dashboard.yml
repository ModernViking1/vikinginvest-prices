name: Deploy Dashboard

# Automatically copies the latest Viking_Invest_Trading_v*.html into dashboard.html
# at the repo root, where GitHub Pages serves it.

on:
  push:
    paths:
      - 'Viking_Invest_Trading_v*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest version file
        id: latest
        run: |
          LATEST=$(ls -1 Viking_Invest_Trading_v*.html 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No versioned HTML files found at repo root"
            exit 1
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest version detected: $LATEST"

      - name: Deploy as dashboard.html
        run: |
          cp "${{ steps.latest.outputs.latest }}" dashboard.html
          echo "Deployed ${{ steps.latest.outputs.latest }} -> dashboard.html"
          ls -la dashboard.html

      - name: Commit and push with race-condition retry
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to commit (dashboard.html already up to date)"
            exit 0
          fi

          git commit -m "Auto-deploy ${{ steps.latest.outputs.latest }} to dashboard.html"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Deployed and pushed"
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi

            echo "Push rejected — fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict — taking our deployed dashboard"
              git checkout --theirs dashboard.html 2>/dev/null || true
              git add dashboard.html 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 3))
          done

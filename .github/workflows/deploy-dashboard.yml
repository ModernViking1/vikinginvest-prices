name: Deploy Dashboard

# Automatically copies the latest Viking_Invest_Trading_v*.html into dashboard.html
# at the repo root, where GitHub Pages serves it.
#
# Triggers on:
#   - any push that adds/modifies a versioned HTML file at the repo root
#   - manual run via the Actions tab
#
# Once GitHub Pages is enabled (Settings → Pages → Source: main / root),
# the dashboard is live at:
#   https://modernviking1.github.io/vikinginvest-prices/dashboard.html

on:
  push:
    paths:
      - 'Viking_Invest_Trading_v*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest version file
        id: latest
        run: |
          LATEST=$(ls -1 Viking_Invest_Trading_v*.html 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No versioned HTML files found at repo root"
            exit 1
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest version detected: $LATEST"

      - name: Deploy as dashboard.html
        run: |
          cp "${{ steps.latest.outputs.latest }}" dashboard.html
          echo "Deployed ${{ steps.latest.outputs.latest }} -> dashboard.html"
          ls -la dashboard.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --staged --quiet; then
            echo "No changes to commit (dashboard.html already up to date)"
          else
            git commit -m "Auto-deploy ${{ steps.latest.outputs.latest }} to dashboard.html"
            git push
            echo "✅ Deployed and pushed"
          fi

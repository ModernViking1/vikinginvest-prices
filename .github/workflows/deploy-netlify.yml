name: Deploy to Netlify (backup CDN)

# Mirrors the same _site bundle as the existing Deploy Pages workflow,
# but pushes to Netlify instead of GitHub Pages. Gives the dashboard
# a second URL that hits a completely different CDN (Netlify's edge,
# Cloudflare under the hood) so when GitHub Pages' Fastly stalls
# for a specific route, the Netlify URL stays responsive.
#
# Setup (one-time, ~4 minutes):
#   1. Sign up at https://netlify.com (free, GitHub auth fine)
#   2. New site → "Deploy manually" → drag any folder (creates empty site)
#   3. Site settings → copy the API ID (looks like "abc-12345-xxx")
#   4. User settings → Applications → Personal access tokens →
#      "New access token" → copy the value (starts with `nfp_...`)
#   5. In this repo: Settings → Secrets and variables → Actions →
#      "New repository secret" twice:
#        NETLIFY_AUTH_TOKEN  = the nfp_... token
#        NETLIFY_SITE_ID     = the abc-12345-xxx site ID
#   6. Trigger this workflow once via Actions → Deploy to Netlify →
#      Run workflow, OR push any change to a tracked HTML file.
#   7. Netlify gives you a `<your-site-name>.netlify.app` URL.
#      Bookmark it for desktop / mobile use.
#
# After setup, the workflow auto-deploys on every push that touches
# the same paths as the Pages deploy — they stay in sync without
# manual intervention.
#
# Before secrets are configured, the workflow runs cleanly to "success"
# with a warning step explaining the setup. No more "Run failed" emails.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'stats.html'
      - 'Viking_Invest_Trading_v*.html'
      - 'font-samples/**/*.html'
      - 'CNAME'
      - '.github/workflows/deploy-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check secrets
        # 2026-06-16: switched from per-step `if: secrets.X != ''` guards
        # to a single bash-level check that writes a step output. The
        # old approach produced "No jobs were run" failures when the
        # secrets weren't set because GitHub's expression evaluator
        # treated missing secrets in a way that skipped every guarded
        # step, leaving the job with zero successful steps → marked
        # as failed. This step ALWAYS runs and decides downstream
        # gating via outputs.
        id: secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Netlify secrets not configured — skipping deploy gracefully."
            echo ""
            echo "To enable the Netlify mirror, follow the setup instructions"
            echo "at the top of .github/workflows/deploy-netlify.yml (~4 min)."
            echo "Until then, this workflow is a no-op and exits clean."
          else
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Netlify secrets present — proceeding with deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.have_secrets == 'true'

      - name: Build _site (mirror of deploy-pages.yml's build step)
        if: steps.secrets.outputs.have_secrets == 'true'
        run: |
          mkdir -p _site
          cp Viking_Invest_Trading_v*.html _site/ 2>/dev/null || true
          LATEST=$(ls -1 _site/Viking_Invest_Trading_v*.html 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            cp "$LATEST" _site/dashboard.html
            echo "Generated _site/dashboard.html from $(basename "$LATEST")"
          else
            echo "::error::No Viking_Invest_Trading_v*.html source found"
            exit 1
          fi
          cp index.html _site/ 2>/dev/null || true
          cp stats.html _site/ 2>/dev/null || true
          if [ -d font-samples ]; then
            mkdir -p _site/font-samples
            cp font-samples/*.html _site/font-samples/ 2>/dev/null || true
          fi
          # Stamp build time so we can verify which deploy a user is on.
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          for f in _site/dashboard.html _site/Viking_Invest_Trading_v*.html; do
            [ -f "$f" ] && sed -i "s/BUILD_TIMESTAMP_UTC/$STAMP/g" "$f"
          done
          # Netlify-only: redirect `/` to the dashboard. The whole point of
          # this mirror is the dashboard fallback when Pages misbehaves —
          # bookmarking the bare netlify.app URL should land users straight
          # on the trading dashboard, not the consultancy landing page.
          # The `!` forces the redirect even though index.html exists at the
          # same path (default Netlify shadowing serves the static file
          # first). This file is Netlify-specific and is intentionally not
          # copied into the GitHub Pages bundle, so vikinginvest.ai/
          # continues to serve the consultancy page unchanged.
          echo "/  /dashboard.html  302!" > _site/_redirects
          ls -lh _site

      - name: Deploy to Netlify
        if: steps.secrets.outputs.have_secrets == 'true'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './_site'
          production-deploy: true
          deploy-message: 'Auto-deploy ${{ github.sha }}'
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

name: cam_rev Session-Window Research (3yr)

# One-off / on-demand research: fetch a deep m15 window and compare cam_rev's London-only
# (07-16 UTC) vs London+US (07-22 UTC) session window for FX / index / commodity, over the full
# 3-year history with both OOS halves. Prints the comparison to the job log (read it there) and
# commits NOTHING — it does not change production or the live session window. Heavy fetch, so
# manual dispatch only, long timeout.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Daily/H1 context window in days'
        default: '1095'
      m15_days:
        description: 'm15 depth in days (the 3-year test surface)'
        default: '1095'

concurrency:
  group: cam-session-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in cam_session_research.py unified_shadow_harness.py detect_triggers.py \
                   fetch_historical_ohlc.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Fetch deep-m15 OHLC (throwaway — not committed)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: |
          DAYS="${{ github.event.inputs.days || '1095' }}"
          M15="${{ github.event.inputs.m15_days || '1095' }}"
          echo "Fetching ${DAYS}d (m15 ${M15}d) to deep-ohlc.json ..."
          python fetch_historical_ohlc.py --days "$DAYS" --m15-days "$M15" --output deep-ohlc.json
          ls -lh deep-ohlc.json

      - name: Run cam_rev session-window comparison (result in this log)
        run: |
          echo "================ RESULT ================"
          python cam_session_research.py --hist deep-ohlc.json
          echo "========================================"
          rm -f deep-ohlc.json

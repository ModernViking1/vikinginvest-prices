name: Swing Signals Feed

# Generates swing-signals.json — the LIVE feed for the ISOLATED demo swing cBot
# (separate from the intraday signals.json). Runs the validated S5+RSI and
# H&S+macro detectors on the latest historical-ohlc.json and publishes the fresh,
# actionable signals for the swing cBot to MARKET-execute on a demo account.
#
# Every 10 min (offset minutes to dodge the :00 herd) PLUS an external-pinger
# entry point. Although swing setups reference 4H/daily context, the trigger bars
# are H1 — so the feed must publish within minutes of an H1 close, or the cBot
# fills stale (see the stop-invalidation / entry-drift guards in swing_signals.py
# and VikingSwingBridge.cs). GitHub's internal cron throttles to 1-3 h gaps, which
# is exactly what produced the 8-9 h stale fills; the repository_dispatch hook lets
# cron-job.org drive it on the real data-refresh cadence, bypassing the throttle.
# This feed is traded ONLY by the separate swing cBot; the intraday cBot and the
# dashboard never read it.

on:
  schedule:
    # Offset off the :00/:10 herd (minute :07) — a 10-min floor if the pinger is down.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  # External-scheduler entry point (same mechanism as fetch-data). cron-job.org POSTs to
  #   https://api.github.com/repos/ModernViking1/vikinginvest-prices/dispatches
  # with body  {"event_type": "swing-feed"}  and an
  #   Authorization: Bearer <fine-grained-PAT>  header (repo Contents: Read & write).
  # Best driven right after each fetch-data publish so a fresh H1 bar -> fresh data ->
  # fresh swing signal all land within a few minutes.
  repository_dispatch:
    types: [swing-feed]

concurrency:
  group: swing-signals-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Guard — required files present
        run: |
          for f in swing_signals.py unified_shadow_harness.py historical-ohlc.json \
                   detect_triggers.py backtest_rsi_per_class.py \
                   hs_swing_research.py five_strategies_research.py; do
            if [ ! -f "$f" ]; then echo "::error::$f missing from repo root"; exit 1; fi
          done

      - name: Generate swing feed
        run: python swing_signals.py

      - name: Commit + push swing-signals.json (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- swing-signals.json; then
            echo "no change to swing-signals.json"; exit 0
          fi
          git add swing-signals.json
          git commit -m "chore: update swing signals feed [skip ci]"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin main 2>&1; then echo "pushed"; pushed=1; break; fi
            echo "push race, rebasing (attempt $i)"; git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((2 ** i))
          done
          if [ "$pushed" != "1" ]; then echo "::error::failed to push swing-signals.json after retries"; exit 1; fi

      - name: Purge CDN (so the swing cBot polls fresh signals, not the edge cache)
        run: |
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/swing-signals.json" || echo "purge gh failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/swing-signals.json" || echo "purge npm failed"

name: Elliott Wave Watchlist Observer

# Observe-only tracker for external discretionary Elliott Wave calls (elliott-watchlist.json).
# We can't mechanize full EW analysis, so we log the analyst calls and track each forward against
# its own levels (watching -> active -> target_hit / invalidated). No capital. Commits the watchlist.

on:
  schedule:
    - cron: '23 6 * * *'      # daily
  workflow_dispatch:

concurrency:
  group: elliott-observer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Guard — required files present
        run: |
          for f in elliott_observer.py elliott-watchlist.json unified_shadow_harness.py \
                   fetch_historical_ohlc.py; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done

      - name: Track external EW calls
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: python elliott_observer.py

      - name: Commit + push the watchlist (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add elliott-watchlist.json
          if git diff --cached --quiet; then
            echo "no change to watchlist"; exit 0
          fi
          git commit -m "chore: update elliott wave watchlist observer [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main 2>&1; then echo pushed; break; fi
            git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((2 ** i))
          done

name: Fetch Earnings Dates (US equity blackout)

# Populates earnings-dates.json for the US equity universe via yfinance (Yahoo, KEYLESS —
# TwelveData /earnings 403s on our plan). The equity bridge reads this to BLACK OUT new
# entries in the days before a symbol's earnings (equity_gap_study found earnings-scale gaps
# blow tight-stop positions far past -1R; the raised US notional cap amplifies the $ hit).
# Weekly is ample — earnings move slowly and the blackout only needs the next report per name.

on:
  schedule:
    - cron: '23 6 * * 0'          # Sundays 06:23 UTC
  workflow_dispatch:

concurrency: { group: fetch-earnings, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install --quiet yfinance
      - name: Guard files present
        run: for f in fetch_earnings.py equity_bridge.py; do [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }; done
      - name: Fetch earnings dates
        run: python fetch_earnings.py
      - name: Commit earnings-dates.json (newest-wins)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earnings-dates.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh earnings-dates.json [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>&1; then echo "pushed on $attempt"; exit 0; fi
            [ "$attempt" = 5 ] && { echo "::error::push failed"; exit 1; }
            git fetch origin main
            F="$(git diff --name-only HEAD~1 HEAD)" && M="$(git log -1 --format=%s)" && git reset --mixed origin/main && git add -f -- $F && git commit -m "$M" --quiet || true
            sleep $((attempt * 3))
          done

name: Ingest cBot Execution

# Phase 3.5 of the broker-bridge roadmap (2026-06-14yy).
#
# Receives a single execution event from the cTrader cBot via
# repository_dispatch and appends it to executions.json. The cBot
# POSTs to the GitHub API on every "placed" / "rejected" / "closed"
# event so the dashboard sees broker fills in near real-time without
# the manual JSONL import step.
#
# Authentication: the cBot signs requests with a fine-scoped PAT
# (scope: repo, expires every 90 days). The PAT lives in cTrader's
# cBot parameters on the VPS — NOT in source — and is rotated via the
# documented procedure in ctrader/README.md.
#
# Schema for the dispatch payload (client_payload field):
#   {
#     "event":         "placed" | "rejected" | "closed",
#     "signal_id":     "pair:creator_ts:wick|fib",
#     "position_id":   long | null,
#     "pair":          "btcusd",
#     "symbol":        "BTCUSD",
#     "dir":           "bull" | "bear",
#     "volume_units":  100000.0,
#     "entry_attempt": 68420.0,
#     "entry_filled":  68422.5,
#     "exit_price":    68842.0,
#     "stop":          68000.0,
#     "target":        68840.0,
#     "r_size":        1.0,
#     "slippage_pips": 0.25,
#     "net_profit":    42.0,
#     "commissions":   0.5,
#     "swap":          0.0,
#     "realized_r":    1.0,
#     "reason":        "target-hit" | "stop-hit" | "manual-or-broker"
#                       | <broker-error-string>,
#     "account_mode":  "demo" | "live",
#     "account":       12345678,
#     "ts":            1717852800000   (epoch ms)
#   }
#
# Trigger:
#   curl -X POST -H "Authorization: token $PAT" \
#        -H "Accept: application/vnd.github+json" \
#        https://api.github.com/repos/ModernViking1/vikinginvest-prices/dispatches \
#        -d '{"event_type":"cbot-execution","client_payload":{...}}'

on:
  repository_dispatch:
    types:
      - cbot-execution

permissions:
  contents: write

# Concurrency group prevents two near-simultaneous dispatches from
# clobbering each other on executions.json. Serial-only within the
# group, but queues rather than cancelling so no events are lost.
concurrency:
  group: ingest-execution
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate + append to executions.json
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 ingest_execution.py

      - name: Commit + push (race-retry)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executions.json
          if git diff --staged --quiet; then
            echo "No change to executions.json (duplicate event dropped by ingest_execution.py)"
            exit 0
          fi
          # Compact subject so the audit trail is greppable: event-type
          # and signal-id make repeat events easy to find.
          EVENT=$(python3 -c "import json,os; print(json.loads(os.environ['PAYLOAD']).get('event','?'))")
          SIGID=$(python3 -c "import json,os; print(json.loads(os.environ['PAYLOAD']).get('signal_id','?'))")
          git commit -m "cbot: $EVENT — $SIGID"
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}

      - name: Push with race-retry
        run: |
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if git push origin main 2>&1; then
              echo "✅ executions.json appended on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::warning::Push failed after $MAX_ATTEMPTS attempts — event will be re-dispatched if cBot retries"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep $((attempt * 2))
          done

      - name: Purge CDN
        run: |
          # Dashboard reads executions.json from the CDN. Purge both
          # paths so the next Performance tab open sees the fresh row.
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/executions.json" || echo "purge gh executions failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/executions.json" || echo "purge npm executions failed"

      - name: Telegram alert (Phase 4 — non-fatal)
        # Sends one Telegram message per ingested execution. The cBot
        # also sends its own Telegram on close events (for redundancy
        # against a workflow outage), but this server-side path is the
        # canonical "this is what landed in the repo" notification —
        # it only fires after successful ingestion, so it cannot lie.
        # Both TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are existing
        # secrets shared with the detect_triggers Telegram path.
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set +e
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          payload = json.loads(os.environ["PAYLOAD"])
          event = payload.get("event", "?")
          sig_id = payload.get("signal_id", "?")
          pair = (payload.get("pair") or "?").upper()
          d = payload.get("dir") or "?"
          mode = payload.get("account_mode", "?")
          prefix = "🔴" if mode == "live" else "🟢"

          if event == "placed":
              entry = payload.get("entry_filled") or payload.get("entry_attempt") or 0
              vol = payload.get("volume_units") or 0
              slip = payload.get("slippage_pips") or 0
              text = f"{prefix} [Viking cBot · ingested] 📤 PLACED {d.upper()} {pair} {vol:.0f} units @ {entry:.5f} (slippage {slip:+.2f} pips)\nid: {sig_id}"
          elif event == "closed":
              netp = payload.get("net_profit") or 0
              r    = payload.get("realized_r") or 0
              reason = payload.get("reason") or "?"
              emoji = "✅" if r > 0 else ("❌" if r < 0 else "↔")
              text = f"{prefix} [Viking cBot · ingested] {emoji} CLOSED {pair} {d.upper()} — net {netp:+.2f} ({r:+.2f}R) · {reason}\nid: {sig_id}"
          elif event == "rejected":
              reason = payload.get("reason") or "?"
              text = f"{prefix} [Viking cBot · ingested] ⚠️ REJECTED {d.upper()} {pair}\nReason: {reason}\nid: {sig_id}"
          else:
              text = f"{prefix} [Viking cBot · ingested] event={event} id={sig_id}"

          # Cap to Telegram's 4096-char limit with a healthy buffer.
          if len(text) > 3500:
              text = text[:3500] + "…"

          data = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text":    text,
              "disable_web_page_preview": "true",
          }).encode()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          try:
              urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=10).read()
              print("[telegram] sent")
          except Exception as e:
              print(f"::warning::Telegram send failed (non-fatal): {e}")
          PY

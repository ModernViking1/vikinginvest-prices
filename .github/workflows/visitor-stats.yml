name: Visitor Stats

# Aggregates dashboard visitor analytics from Supabase usage_events into visitor-stats.json
# (counts only — no PII), which the dashboard's Traffic panel renders. Needs the SUPABASE_SERVICE_KEY
# repo secret (service-role, NOT the anon key). Fail-open: never breaks on a Supabase hiccup.

on:
  schedule:
    - cron: '17 */6 * * *'      # every 6 hours, offset off the herd
  workflow_dispatch:

concurrency:
  group: visitor-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Fetch + aggregate visitor stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_visitor_stats.py

      - name: Commit + push (retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visitor-stats.json
          if git diff --cached --quiet; then
            echo "no change to visitor-stats"; exit 0
          fi
          git commit -m "chore: update visitor stats [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main 2>&1; then echo pushed; break; fi
            git fetch origin main && git rebase origin/main || git rebase --abort
            sleep $((2 ** i))
          done

      - name: Purge CDN
        run: curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/visitor-stats.json" || echo "purge failed"

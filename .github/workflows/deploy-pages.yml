name: Deploy Pages

# Replaces GitHub's default "Deploy from branch" Pages build, which rebuilds
# Pages on EVERY commit to main — including all the data-file commits from
# fetch-prices, publish-intraday-ohlc, and publish-events. At ~10-17 commits
# per hour from those workflows that was 240-400+ pages-build-deployment
# runs per day doing nothing useful (the dashboard fetches data from the
# CDN, not from Pages-served files), burning workflow runs and indirectly
# worsening the cron throttle on the data workflows.
#
# This workflow only fires when files that actually appear on the live site
# change. Data-file commits are skipped entirely.
#
# REQUIRES MANUAL ONE-TIME SETUP:
#   Repo Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
# (Currently "Deploy from a branch". The default branch deploy must be
# turned off or this workflow's deploys won't take effect.)

on:
  push:
    branches: [main]
    paths:
      # dashboard.html is no longer tracked in the repo — deploy-time
      # derived from Viking_Invest_Trading_v*.html. Trigger on the source.
      - 'index.html'
      # Admin stats page — behind a Supabase market-access-link gate
      # restricted to the admin email allowlist. The page is unlinked
      # from the rest of the site and marked noindex/nofollow.
      - 'stats.html'
      - 'Viking_Invest_Trading_v*.html'
      - 'font-samples/**/*.html'
      - 'CNAME'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Coalesce rapid-fire pushes: if a new push arrives while a run is
# waiting in the debounce step (or building), the in-flight run is
# cancelled and the new push restarts the 5-min countdown. Only the
# LAST commit in a quiet window actually deploys. Cancelling a deploy
# mid-publish is safe — the previous successful deploy stays live and
# the new run replaces it on completion.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Debounce — coalesce rapid commits into one deploy
        # Pushes within 5 min of each other collapse to a single deploy.
        # The leading sleep gives the concurrency policy a window in
        # which to cancel this run if a newer push lands. Net effect:
        # 10 commits in 5 min → 1 Pages deploy, 1 Fastly purge, no
        # edge-cache thrash. Without this, every push purged Fastly
        # and surfaced POP-to-POP cache inconsistency.
        run: |
          echo "Debouncing for 5 minutes. If another push to main"
          echo "arrives during this wait, this run will be cancelled"
          echo "and only the latest commit deploys."
          sleep 300

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site (HTML only — data is fetched from CDN)
        run: |
          mkdir -p _site
          # Include all versioned HTML files so older bookmarks keep working
          cp Viking_Invest_Trading_v*.html _site/ 2>/dev/null || true
          # Derive dashboard.html from the latest versioned source. The
          # repo no longer tracks dashboard.html as a separate file — it
          # was always byte-identical to the latest Viking_Invest_Trading
          # version, just duplicated. Generating it here at deploy time
          # means single-source edits to the versioned file automatically
          # publish under the legacy /dashboard.html bookmark.
          LATEST=$(ls -1 _site/Viking_Invest_Trading_v*.html 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            cp "$LATEST" _site/dashboard.html
            echo "Generated _site/dashboard.html from $(basename "$LATEST")"
          else
            echo "::error::No Viking_Invest_Trading_v*.html source found"
            exit 1
          fi
          # Optional landing page if present
          cp index.html _site/ 2>/dev/null || true
          # Private visitor-stats page (unlinked, noindex). Gated by
          # Supabase market-access-link sign-in against the admin
          # email allowlist.
          cp stats.html _site/ 2>/dev/null || true
          # Font-sample variants of the consultancy page — unlinked from
          # the live nav; reached via /font-samples/. Existence is
          # optional so deploys still succeed once the samples are
          # eventually deleted.
          if [ -d font-samples ]; then
            mkdir -p _site/font-samples
            cp font-samples/*.html _site/font-samples/ 2>/dev/null || true
          fi
          # Custom domain if present
          cp CNAME _site/ 2>/dev/null || true

          # Stamp the real deploy time into the header. The repo keeps the
          # literal "BUILD_TIMESTAMP_UTC" placeholder; only the deployed
          # copies get the real value. This gives the user a reliable way
          # to confirm a hard-refresh actually picked up a new deploy —
          # the previous static "Build 13 May 07:30" string never changed
          # so a stale cache was indistinguishable from a fresh load.
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Build stamp: $STAMP"
          for f in _site/dashboard.html _site/Viking_Invest_Trading_v*.html; do
            [ -f "$f" ] && sed -i "s/BUILD_TIMESTAMP_UTC/$STAMP/g" "$f"
          done

          echo "Files staged for Pages:"
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

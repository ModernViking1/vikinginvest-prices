name: Swing-Trail Backtest (3yr deep cache, read-only)

# Runs swing_trail_backtest.py over the 3-year deep cache to check whether a tighter trail (0.75R,
# 0.5R) beats the live 1.0R trail on the swing book's FIXED-RR2-target + trail exit — a different
# mechanic from the .EQ pure runner, so it needs its own confirmation. Commits nothing.

on:
  workflow_dispatch:

concurrency: { group: swing-trail-backtest, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip requests
      - name: Guard files present
        run: for f in swing_trail_backtest.py trail_partial_research.py be_stop_research.py backtest_rsi_per_class.py detect_triggers.py fetch_historical_ohlc.py; do [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }; done
      - name: Restore deep m15 cache (else fetch 3yr)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}', OANDA_TOKEN: '${{ secrets.OANDA_TOKEN }}', CACHE_TAG: deep-ohlc-cache }
        run: |
          if gh release download "$CACHE_TAG" --repo "$GITHUB_REPOSITORY" -p deep-ohlc.json.gz --clobber 2>/dev/null; then
            gunzip -c deep-ohlc.json.gz > deep-ohlc.json; echo "restored $(ls -lh deep-ohlc.json|awk '{print $5}')"
          else
            python fetch_historical_ohlc.py --days 1095 --m15-days 1095 --output deep-ohlc.json
          fi
      - name: Swing trail-distance variants over 3yr
        run: |
          echo "================ RESULT ================"
          python swing_trail_backtest.py --hist deep-ohlc.json
          echo "========================================"
          rm -f deep-ohlc.json deep-ohlc.json.gz

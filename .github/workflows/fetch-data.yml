name: Fetch Data (prices + intraday OHLC)

# Replaces fetch-prices.yml and publish-intraday-ohlc.yml.
#
# Combining the two scheduled workflows into one reduces simultaneous
# scheduler queue contention on this repo (GitHub throttles aggressively
# when multiple scheduled workflows share minute marks). The offset cron
# (minute :03 / :13 / :23 / ... instead of :00 / :10 / ...) also dodges
# the heavily-oversubscribed top-of-the-minute slot.
#
# Steps:
#   1. Setup Node + Python
#   2. Fetch live prices (TwelveData / OANDA / Coinbase) — writes prices.json
#   3. Publish intraday OHLC (real M15 candles from OANDA / Coinbase) —
#      writes intraday-ohlc.json
#   4. Single commit + retry-on-race-condition push
#   5. Build package.json, npm publish (snapshots BOTH files together,
#      unlike the old split workflows where intraday-ohlc.json was
#      always one fetch-prices cycle behind in npm)
#   6. jsDelivr cache purges for both /gh/@main and /npm/@latest paths

on:
  schedule:
    # Offset crons to dodge the :00 / :10 / :20 herd. Minute :03 is far
    # less subscribed than minute :00, which materially improves the
    # fire-rate against GH's scheduler throttle. Same 10-min cadence.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  # External-scheduler entry point. Lets cron-job.org / Uptime Kuma / etc.
  # trigger this workflow via the GitHub REST `repository_dispatch` API,
  # bypassing the internal cron throttle that's been giving 1-3 h gaps.
  #
  # External pinger POSTs to
  #   https://api.github.com/repos/ModernViking1/vikinginvest-prices/dispatches
  # with body
  #   {"event_type": "fetch-data"}
  # and an `Authorization: Bearer <fine-grained-PAT>` header. Auth needs
  # repo `Contents: Read & write` permission (or `Actions: Write` for
  # tighter scope).
  repository_dispatch:
    types: [fetch-data]

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify scripts exist
        run: |
          missing=0
          if [ ! -f fetch-prices.js ]; then
            echo "::error::fetch-prices.js missing from repo root"
            missing=1
          fi
          if [ ! -f publish_intraday_ohlc.py ]; then
            echo "::error::publish_intraday_ohlc.py missing from repo root"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            ls -la
            exit 1
          fi

      # Step 1: live prices via Node script (OANDA + Coinbase).
      # TwelveData dependency removed in v5 — all FX/index/commodity
      # data comes from OANDA, all crypto from Coinbase. TD_API_KEY
      # secret can be deleted from repo settings if no other workflow
      # uses it.
      - name: Fetch prices
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: node fetch-prices.js

      # Step 2: intraday OHLC — fetches real M15 candles directly (OANDA
      # /candles + Coinbase /candles). Runs unconditionally — if the
      # prices fetch failed, intraday may still succeed (separate API
      # call) and a partial commit beats none.
      - name: Publish intraday OHLC
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        run: python publish_intraday_ohlc.py --output intraday-ohlc.json

      # Step 3: commit all changed data files in a single commit.
      # Race-condition-resistant push (rebase + retry on conflict) carries
      # forward from the old split workflows.
      - name: Commit and push with race-condition retry
        id: push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage every data file we may have touched.
          for f in prices.json history.json intraday-ohlc.json intraday-state.json intraday.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit — exiting"
            echo "pushed=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore: update data (prices + intraday)"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Push attempt $attempt of $MAX_ATTEMPTS"
            if git push origin main 2>&1; then
              echo "✅ Push succeeded on attempt $attempt"
              echo "pushed=1" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Push failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi

            # Push rejected — a concurrent Fetch Data run updated main.
            # Rebuild our commit directly on top of the latest main:
            # reset onto it (--mixed moves HEAD + index only, leaving our
            # freshly-generated data files in the working tree), then
            # re-stage and recommit. This sidesteps rebase/merge conflicts
            # entirely — our data is the newest, so "newest wins" is the
            # correct resolution — and avoids the `git rebase --continue`
            # editor prompt that hangs/fails in a headless CI runner.
            echo "Push rejected — rebuilding our data commit onto latest main..."
            git fetch origin main
            git reset --mixed origin/main
            for f in prices.json history.json intraday-ohlc.json intraday-state.json intraday.json; do
              if [ -f "$f" ]; then
                git add "$f"
              fi
            done
            if git diff --cached --quiet; then
              echo "No changes vs latest main — nothing to push"
              echo "pushed=0" >> $GITHUB_OUTPUT
              exit 0
            fi
            git commit -m "chore: update data (prices + intraday)"
            sleep $((attempt * 3))
          done

      - name: Build package.json for npm
        if: steps.push.outputs.pushed == '1'
        run: |
          VERSION="1.0.$(date +%s)"
          cat > package.json <<PKG
          {
            "name": "vikinginvest-prices",
            "version": "$VERSION",
            "description": "Live FX prices for Viking Invest dashboard",
            "main": "prices.json",
            "jsdelivr": "prices.json",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ModernViking1/vikinginvest-prices.git"
            }
          }
          PKG

      - name: Detect triggers + send Telegram alerts
        # Inlined here on 2026-06-02 because alert-on-trigger.yml's
        # scheduled cron `*/5 * * * *` was being throttled by GitHub
        # Actions to ~every 4 hours (last successful schedule run was
        # 17:10 UTC, before which a 4-hour gap). The workflow_run
        # chain on alert-on-trigger from this workflow was also not
        # firing — likely because workflow_run doesn't reliably chain
        # off `repository_dispatch` upstream events.
        #
        # Running detect_triggers.py inline here means alerts inherit
        # fetch-data's reliable every-5-min cadence. alert-on-trigger
        # stays in the repo as a catch-up workflow (schedule + manual
        # dispatch) but is no longer the live-latency path.
        #
        # The detector reads the data files we just committed above,
        # so we don't need a separate checkout step.
        if: steps.push.outputs.pushed == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e  # don't fail the workflow on alert errors — data already pushed
          python detect_triggers.py
          DT_EXIT=$?
          if [ $DT_EXIT -ne 0 ]; then
            echo "::warning::detect_triggers.py exited $DT_EXIT (non-fatal — data already pushed)"
            exit 0
          fi
          set -e
          # 2026-06-14 — Phase 1 of the broker-bridge roadmap. Transform
          # alerts-state.json into a clean signals.json contract the MT5
          # EA on a VPS polls every 30s. The script is purely a
          # projection — no detector logic, no network — so it can never
          # fail the pipeline. We tolerate a non-zero exit code the same
          # way detect_triggers does so a quirky alert-state never blocks
          # the data push.
          set +e
          python build_signals_json.py
          BS_EXIT=$?
          set -e
          if [ $BS_EXIT -ne 0 ]; then
            echo "::warning::build_signals_json.py exited $BS_EXIT — signals.json not refreshed this cycle"
          fi
          # Commit alerts-state.json + directions.json + signals.json
          # together so the broker-bridge view always matches what the
          # detector just published. Race-retry pattern matches the
          # data-files step.
          git add alerts-state.json directions.json signals.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No alert-state changes to commit"
            exit 0
          fi
          git commit -m "chore: update alert state + directions + signals"
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if git push origin main 2>&1; then
              echo "✅ Alert state pushed (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::warning::Alert state push failed after $MAX_ATTEMPTS attempts — next run picks it up"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep $((attempt * 2))
          done

      - name: Publish to npm (non-fatal)
        if: steps.push.outputs.pushed == '1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm publish failures must not fail this workflow — the
          # canonical data is already in the GitHub repo, and statically.io
          # and jsDelivr's /gh/ endpoint serve it without depending on npm.
          if npm publish --access=public 2>&1; then
            echo "✅ npm publish succeeded"
          else
            echo "::warning::npm publish failed (non-fatal). Data still served via /gh/@main and raw.github."
          fi

      - name: Purge jsDelivr cache (non-fatal)
        if: steps.push.outputs.pushed == '1'
        run: |
          # /gh/@main path — used by the dashboard's fetchVikingIntraday
          # and fetchViking15min as the freshest source. Purging here
          # makes the new git commit visible at the CDN within seconds.
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/prices.json" || echo "purge gh prices failed"
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/intraday-ohlc.json" || echo "purge gh intraday-ohlc failed"
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/intraday-state.json" || echo "purge gh intraday-state failed"

          # /npm/@latest path — same as the old fetch-prices.yml. The
          # @latest resolution caches separately from file content; both
          # need to be invalidated to clear the version pointer.
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/prices.json" || echo "purge npm prices failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/history.json" || echo "purge npm history failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/intraday-ohlc.json" || echo "purge npm intraday-ohlc failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/events.json" || echo "purge npm events failed"
          # directions.json — the slim server-computed EW/TL/NW file the
          # dashboard reads instead of the 90 MB historical-ohlc.json.
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/directions.json" || echo "purge npm directions failed"
          # signals.json — broker-bridge contract (Phase 1, 2026-06-14).
          # Both CDN paths purged so the cTrader cBot on a VPS sees the
          # new signal set within seconds of the workflow committing.
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/signals.json" || echo "purge gh signals failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/signals.json" || echo "purge npm signals failed"
          # kill-switch.json — Phase 2 broker pause control. Polled
          # independently of signals.json by the cBot every cycle, so
          # both paths need their own purge call here (the set-kill-switch
          # workflow does its own purge too, but a stale CDN copy
          # during the fetch-data cron window would be confusing).
          curl -s -m 10 "https://purge.jsdelivr.net/gh/ModernViking1/vikinginvest-prices@main/kill-switch.json" || echo "purge gh kill-switch failed"
          curl -s -m 10 "https://purge.jsdelivr.net/npm/vikinginvest-prices@latest/kill-switch.json" || echo "purge npm kill-switch failed"
